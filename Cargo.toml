[package]
name = "window-time-tracker"
version = "0.1.0"
edition = "2021"

[dependencies]

# Only pulled in (and only compiled) when building for Linux.
[target.'cfg(target_os = "linux")'.dependencies]
swayipc = "3"      # for the Sway backend
x11rb = "0.13"     # for the X11 backend

# Only pulled in when building for macOS.
[target.'cfg(target_os = "macos")'.dependencies]
# objc2 = "0.5"
# objc2-app-kit = "0.2"

# Only pulled in when building for Windows.
[target.'cfg(target_os = "windows")'.dependencies]
